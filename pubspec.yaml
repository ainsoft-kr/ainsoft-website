name: getx_starter
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.41.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_modular: ^7.1.1
  loader_overlay: ^5.0.0
  flutter_spinkit: ^5.2.2
  connectivity_plus: ^7.3.2
  flutter_svg: ^2.3.0
  google_fonts: ^9.0.0
  intl: ^0.20.3
  responsive_framework: ^1.5.1
  flutter_smooth_markdown: ^0.10.0
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/posts/
    - google_fonts/
